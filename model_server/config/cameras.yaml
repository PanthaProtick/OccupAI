# Three local files simulate independent CCTV cameras for the checkpoint.
model: model_server/models/yolo11m.pt
imgsz: 960
classes: [0]
device: 0
confidence: 0.2
sample_fps: 3.0
loop_videos: true
stabilization_window_seconds: 2.0
tracker_config: model_server/config/bytetrack_custom.yaml
cameras:
  - camera_id: camera_01
    source: model_server/videos/test1.avi
  - camera_id: camera_02
    source: model_server/videos/test2.avi
  - camera_id: camera_03
    source: model_server/videos/test3.mp4
