openapi: 3.1.0
info:
  title: OccupAI Product API
  description: Stable frontend-facing occupancy API with a replaceable data repository.
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - system
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/auth/signup:
    post:
      tags:
      - authentication
      summary: Signup
      operationId: signup_api_auth_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': &id001
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      tags:
      - authentication
      summary: Login
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': *id001
  /api/auth/logout:
    post:
      tags:
      - authentication
      summary: Logout
      operationId: logout_api_auth_logout_post
      responses:
        '204':
          description: Successful Response
  /api/auth/me:
    get:
      tags:
      - authentication
      summary: Me
      operationId: me_api_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/profile:
    get:
      tags:
      - profile
      summary: Get Profile
      operationId: get_profile_api_profile_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
    patch:
      tags:
      - profile
      summary: Update Profile
      operationId: update_profile_api_profile_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400': *id001
  /api/profile/change-password:
    post:
      tags:
      - profile
      summary: Change Password
      operationId: change_password_api_profile_change_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '400': *id001
  /api/notifications:
    get:
      tags:
      - notifications
      summary: List Notifications
      operationId: list_notifications_api_notifications_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 1024
          - type: 'null'
          title: Cursor
      - name: unread_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Unread Only
      - name: include_dismissed
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Dismissed
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsResponse'
        '400': *id001
  /api/notifications/{notification_id}/read:
    post:
      tags:
      - notifications
      summary: Mark Notification Read
      operationId: mark_notification_read_api_notifications__notification_id__read_post
      parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: string
          title: Notification Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400': *id001
  /api/notifications/read-all:
    post:
      tags:
      - notifications
      summary: Mark All Notifications Read
      operationId: mark_all_notifications_read_api_notifications_read_all_post
      responses:
        '204':
          description: Successful Response
  /api/notifications/{notification_id}/dismiss:
    post:
      tags:
      - notifications
      summary: Dismiss Notification
      operationId: dismiss_notification_api_notifications__notification_id__dismiss_post
      parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: string
          title: Notification Id
      responses:
        '204':
          description: Successful Response
        '400': *id001
  /api/notification-preferences:
    get:
      tags:
      - notifications
      summary: Get Notification Preferences
      operationId: get_notification_preferences_api_notification_preferences_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
    patch:
      tags:
      - notifications
      summary: Update Notification Preferences
      operationId: update_notification_preferences_api_notification_preferences_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferencesUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '400': *id001
  /ready:
    get:
      tags:
      - system
      summary: Ready
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/rooms:
    get:
      tags:
      - rooms
      summary: List Rooms
      operationId: list_rooms_api_rooms_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomsResponse'
  /api/rooms/{room_id}:
    get:
      tags:
      - rooms
      summary: Get Room
      operationId: get_room_api_rooms__room_id__get
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: string
          title: Room Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '400': *id001
  /api/occupancy:
    get:
      tags:
      - occupancy
      summary: List Occupancy
      operationId: list_occupancy_api_occupancy_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupancyListResponse'
  /api/occupancy/{camera_id}:
    get:
      tags:
      - occupancy
      summary: Get Occupancy
      operationId: get_occupancy_api_occupancy__camera_id__get
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: string
          title: Camera Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupancyResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '400': *id001
  /api/history:
    get:
      tags:
      - history
      summary: Get History
      operationId: get_history_api_history_get
      parameters:
      - name: room_id
        in: query
        required: true
        schema:
          type: string
          pattern: ^room_[a-z0-9_]+$
          description: Canonical room identifier
          title: Room Id
        description: Canonical room identifier
      - name: range
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/HistoryRange'
          description: 'Aggregation bucket across retained history: hourly, daily,
            or one weekly bucket'
        description: 'Aggregation bucket across retained history: hourly, daily, or
          one weekly bucket'
      - name: metric
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/HistoryMetric'
          description: Value represented by each history point
        description: Value represented by each history point
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '400': *id001
components:
  schemas:
    AuthResponse:
      properties:
        data:
          $ref: '#/components/schemas/PublicUser'
      additionalProperties: false
      type: object
      required:
      - data
      title: AuthResponse
    CameraStatus:
      type: string
      enum:
      - online
      - stale
      - offline
      title: CameraStatus
    ChangePasswordRequest:
      properties:
        current_password:
          type: string
          title: Current Password
        new_password:
          type: string
          title: New Password
      additionalProperties: false
      type: object
      required:
      - current_password
      - new_password
      title: ChangePasswordRequest
    CollectionMeta:
      properties:
        count:
          type: integer
          minimum: 0.0
          title: Count
        generated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Generated At
      additionalProperties: false
      type: object
      required:
      - count
      title: CollectionMeta
    ErrorBody:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        details:
          additionalProperties: true
          type: object
          title: Details
      additionalProperties: false
      type: object
      required:
      - code
      - message
      title: ErrorBody
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          default: ok
        data_source:
          type: string
          title: Data Source
      additionalProperties: false
      type: object
      required:
      - data_source
      title: HealthResponse
    HistoryMeta:
      properties:
        room_id:
          type: string
          title: Room Id
        range:
          $ref: '#/components/schemas/HistoryRange'
        metric:
          $ref: '#/components/schemas/HistoryMetric'
        count:
          type: integer
          minimum: 0.0
          title: Count
        generated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Generated At
      additionalProperties: false
      type: object
      required:
      - room_id
      - range
      - metric
      - count
      title: HistoryMeta
    HistoryMetric:
      type: string
      enum:
      - occupancy
      - percentage
      title: HistoryMetric
    HistoryPoint:
      properties:
        bucket_start:
          type: string
          format: date-time
          title: Bucket Start
        value:
          type: number
          minimum: 0.0
          title: Value
        coverage_percentage:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Coverage Percentage
          default: 100.0
      additionalProperties: false
      type: object
      required:
      - bucket_start
      - value
      title: HistoryPoint
    HistoryRange:
      type: string
      enum:
      - hour
      - day
      - week
      title: HistoryRange
    HistoryResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/HistoryPoint'
          type: array
          title: Data
        meta:
          $ref: '#/components/schemas/HistoryMeta'
      additionalProperties: false
      type: object
      required:
      - data
      - meta
      title: HistoryResponse
    LoginRequest:
      properties:
        email:
          type: string
          maxLength: 320
          minLength: 3
          title: Email
        password:
          type: string
          maxLength: 128
          minLength: 1
          title: Password
      additionalProperties: false
      type: object
      required:
      - email
      - password
      title: LoginRequest
    Notification:
      properties:
        id:
          type: string
          title: Id
        type:
          type: string
          title: Type
        category:
          type: string
          title: Category
        title:
          type: string
          title: Title
        message:
          type: string
          title: Message
        room_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Room Id
        suggested_room_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Suggested Room Id
        occupancy_percentage:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Occupancy Percentage
        created_at:
          type: string
          format: date-time
          title: Created At
        read_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Read At
        dismissed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Dismissed At
      additionalProperties: false
      type: object
      required:
      - id
      - type
      - category
      - title
      - message
      - created_at
      title: Notification
    NotificationPreferences:
      properties:
        in_app_enabled:
          type: boolean
          title: In App Enabled
        high_occupancy_enabled:
          type: boolean
          title: High Occupancy Enabled
        high_occupancy_threshold:
          type: integer
          maximum: 100.0
          minimum: 50.0
          title: High Occupancy Threshold
        cooldown_minutes:
          type: integer
          maximum: 10080.0
          exclusiveMinimum: 0.0
          title: Cooldown Minutes
      additionalProperties: false
      type: object
      required:
      - in_app_enabled
      - high_occupancy_enabled
      - high_occupancy_threshold
      - cooldown_minutes
      title: NotificationPreferences
    NotificationPreferencesUpdate:
      properties:
        in_app_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: In App Enabled
        high_occupancy_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: High Occupancy Enabled
        high_occupancy_threshold:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 50.0
          - type: 'null'
          title: High Occupancy Threshold
        cooldown_minutes:
          anyOf:
          - type: integer
            maximum: 10080.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Cooldown Minutes
      additionalProperties: false
      type: object
      title: NotificationPreferencesUpdate
    NotificationsResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Notification'
          type: array
          title: Items
        unread_count:
          type: integer
          minimum: 0.0
          title: Unread Count
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      additionalProperties: false
      type: object
      required:
      - items
      - unread_count
      title: NotificationsResponse
    Occupancy:
      properties:
        camera_id:
          type: string
          pattern: ^cam_\d{3}$
          title: Camera Id
        room_id:
          type: string
          pattern: ^room_[a-z0-9_]+$
          title: Room Id
        occupancy:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Occupancy
        raw_occupancy:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Raw Occupancy
        capacity:
          type: integer
          exclusiveMinimum: 0.0
          title: Capacity
        occupancy_percentage:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Occupancy Percentage
        status:
          $ref: '#/components/schemas/CameraStatus'
        updated_at:
          type: string
          format: date-time
          title: Updated At
      additionalProperties: false
      type: object
      required:
      - camera_id
      - room_id
      - capacity
      - status
      - updated_at
      title: Occupancy
    OccupancyListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Occupancy'
          type: array
          title: Data
        meta:
          $ref: '#/components/schemas/CollectionMeta'
      additionalProperties: false
      type: object
      required:
      - data
      - meta
      title: OccupancyListResponse
    OccupancyResponse:
      properties:
        data:
          $ref: '#/components/schemas/Occupancy'
      additionalProperties: false
      type: object
      required:
      - data
      title: OccupancyResponse
    Profile:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        email:
          type: string
          title: Email
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - email
      - created_at
      - updated_at
      title: Profile
    ProfileUpdateRequest:
      properties:
        name:
          type: string
          title: Name
      additionalProperties: false
      type: object
      required:
      - name
      title: ProfileUpdateRequest
    PublicUser:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        email:
          type: string
          title: Email
        role:
          type: string
          title: Role
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - email
      - role
      - created_at
      title: PublicUser
    Room:
      properties:
        room_id:
          type: string
          pattern: ^room_[a-z0-9_]+$
          title: Room Id
        name:
          type: string
          minLength: 1
          title: Name
        capacity:
          type: integer
          exclusiveMinimum: 0.0
          title: Capacity
        building:
          type: string
          minLength: 1
          title: Building
        floor:
          type: integer
          minimum: 0.0
          title: Floor
        camera_id:
          type: string
          pattern: ^cam_\d{3}$
          title: Camera Id
        behavior_profile:
          type: string
          minLength: 1
          title: Behavior Profile
      additionalProperties: false
      type: object
      required:
      - room_id
      - name
      - capacity
      - building
      - floor
      - camera_id
      - behavior_profile
      title: Room
    RoomResponse:
      properties:
        data:
          $ref: '#/components/schemas/RoomView'
      additionalProperties: false
      type: object
      required:
      - data
      title: RoomResponse
    RoomView:
      properties:
        room_id:
          type: string
          pattern: ^room_[a-z0-9_]+$
          title: Room Id
        name:
          type: string
          minLength: 1
          title: Name
        capacity:
          type: integer
          exclusiveMinimum: 0.0
          title: Capacity
        building:
          type: string
          minLength: 1
          title: Building
        floor:
          type: integer
          minimum: 0.0
          title: Floor
        camera_id:
          type: string
          pattern: ^cam_\d{3}$
          title: Camera Id
        behavior_profile:
          type: string
          minLength: 1
          title: Behavior Profile
        occupancy:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Occupancy
        raw_occupancy:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Raw Occupancy
        occupancy_percentage:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Occupancy Percentage
        intensity:
          anyOf:
          - type: string
          - type: 'null'
          title: Intensity
        status:
          $ref: '#/components/schemas/CameraStatus'
        updated_at:
          type: string
          format: date-time
          title: Updated At
      additionalProperties: false
      type: object
      required:
      - room_id
      - name
      - capacity
      - building
      - floor
      - camera_id
      - behavior_profile
      - status
      - updated_at
      title: RoomView
    RoomsResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Room'
          type: array
          title: Data
        meta:
          $ref: '#/components/schemas/CollectionMeta'
      additionalProperties: false
      type: object
      required:
      - data
      - meta
      title: RoomsResponse
    SignupRequest:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 2
          title: Name
        email:
          type: string
          maxLength: 320
          minLength: 3
          title: Email
        password:
          type: string
          maxLength: 128
          minLength: 1
          title: Password
      additionalProperties: false
      type: object
      required:
      - name
      - email
      - password
      title: SignupRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
